<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <span class="auth-emoji">🔐</span>
      <h1>Connexion</h1>
      <p>Content de te revoir, détective.</p>
    </div>

    @if (errorMsg) {
      <div class="alert-error">{{ errorMsg }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="harry@poudlard.fr" />
        @if (f['email'].invalid && f['email'].touched) {
          <span class="error-msg">Email invalide.</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        @if (f['password'].invalid && f['password'].touched) {
          <span class="error-msg">6 caractères minimum.</span>
        }
      </div>

      <button type="submit" class="btn btn--primary btn--full" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="auth-footer">
      Pas encore de compte ?
      <a routerLink="/auth/register">S'inscrire</a>
    </p>
  </div>
</div>
